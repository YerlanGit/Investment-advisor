# Конфигурация gitleaks — разбор ЛОЖНЫХ срабатываний.
#
# Правило, которому подчинён этот файл
# ───────────────────────────────────
# Исключение вносится ТОЧЕЧНО и с обоснованием. Сканер секретов, отключённый
# «чтобы CI позеленел», хуже отсутствующего: он создаёт впечатление проверки,
# которой нет. Поэтому здесь нет ни одного исключения по КАТАЛОГУ и ни одного
# отключённого правила — только конкретные значения, каждое проверено глазами.
#
# 🔴 Почему исключения нужны, хотя литералы уже переименованы
# `gitleaks detect` сканирует ВСЮ ИСТОРИЮ git, а не рабочее дерево. Строка,
# попавшая в коммит, остаётся в нём навсегда — переименование новым коммитом
# CI не чинит. Альтернативы: переписать историю (force-push в ветку с открытым
# PR) или внести исключение. Выбрано второе как обратимое и не трогающее чужие
# коммиты.
#
# 🔴 Секция называется `[allowlist]` — В ЕДИНСТВЕННОМ ЧИСЛЕ
# Форма `[[allowlists]]` (массив) появилась в более поздних версиях gitleaks и
# в 8.21, которую ставит `gitleaks-action@v2`, **молча игнорируется**: конфиг
# читается, ошибок нет, исключения не применяются. Проверено замером — первая
# редакция этого файла была написана в форме массива и не работала.
# Следствие: `paths` и `regexes` живут в ОДНОМ блоке и объединяются по ИЛИ,
# поэтому `paths` здесь не используется вовсе — он разрешил бы файл целиком.
#
# `regexes` сопоставляются с САМИМ СЕКРЕТОМ (полем `Secret`), а не со строкой
# кода: шаблон вида `fake_api_key\s*=\s*"…"` не сработает, нужен шаблон
# значения.
#
# Как убедиться, что список не превратился в глушилку
#   printf 'aws_key = "AKIAIOSFODNN7EXAMPLE"\n' > /tmp/canary/c.py
#   gitleaks detect --source /tmp/canary --no-git -c .gitleaks.toml   # обязан найти
#
# Перепроверка находок
#   gitleaks detect --source . --report-format json --report-path /tmp/gl.json

[extend]
useDefault = true

[allowlist]
description = "Проверенные ложные срабатывания: тестовые векторы, демо-заглушки, имя FRED-серии"

regexes = [
    # ── 1. Тестовые векторы подписи freedom-etl ──────────────────────────────
    # `freedom-etl/tests/test_auth.py` проверяет HMAC-SHA256 замороженными
    # векторами: фиксированный ключ + фиксированный timestamp → известная
    # подпись. Ключ обязан быть литералом — тест, вычисляющий его на лету,
    # проверял бы код самим собой.
    #
    # Первые две строки жили в коммите 1a18802 и заменены на словарные
    # `EXAMPLE-*`, которые энтропийное правило не ловит. Нужны только истории;
    # удалить можно, когда история будет переписана.
    '''sec_0123456789abcdef0123456789abcdef012345''',
    '''pub_0123456789abcdef0123456789abcd''',
    '''EXAMPLE-(PUBLIC|SECRET)-KEY-FOR-UNIT-TESTS''',

    # ── 2. Демо-сценарий регистрации ─────────────────────────────────────────
    # `src/agent/advisor_bot.py:30` — учебный прогон работы с vault. Переменные
    # буквально названы `fake_api_key` / `fake_secret`. Существовало до ветки
    # `freedom-etl`, коммит 765430f (уже в `main`).
    # Шаблон описывает ФОРМУ заглушки (`FRDM_<СЛОВО>_<цифры>_<СЛОВО>`) и не
    # может совпасть с настоящим ключом Tradernet: у тех другой алфавит и длина.
    '''^FRDM_[A-Z]+_[0-9]+_[A-Z]+$''',

    # ── 3. Идентификатор макро-серии FRED ────────────────────────────────────
    # `src/services/macro_data.py:108` — `key = "yield_curve_10y2y"` внутри
    # `SeriesSpec`. Это ИМЯ СЕРИИ в каталоге, а не секрет: правило сработало на
    # слове `key` в названии поля. Существовало до ветки `freedom-etl`.
    #
    # Литерал, а НЕ шаблон `^[a-z][a-z0-9_]*$`: тот разрешил бы любой секрет в
    # нижнем регистре и обнулил бы правило целиком. Если новая серия когда-нибудь
    # сработает — добавить её сюда отдельной строкой, это одна правка.
    '''^yield_curve_10y2y$''',
]
