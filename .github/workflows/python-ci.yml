name: Python CI

# F-9: PR-merge gate.  Until this workflow existed the ONLY automated check
# was the Cloud Build deploy-time test gate — a PR could merge to main with
# zero verification.  Tests are BLOCKING; dependency / secret scans start as
# advisory (continue-on-error) until a hash-locked requirements file lands,
# then should be flipped to blocking.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: pytest + deploy-gate mirror
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Hermetic engine suite (mirrors the Cloud Build deploy gate)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_phase*.py"
      - name: Full pytest suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

  dependency-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # advisory until requirements are hash-pinned (F-8)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pip-audit
      # 🔴 §−103. Три CVE в chromadb ПОДАВЛЕНЫ ОСОЗНАННО, и вот проверка,
      # которая это оправдывает — повторите её, прежде чем менять строку.
      #
      #   1. Фикса НЕ СУЩЕСТВУЕТ. Колонка «Fix Versions» пуста у всех трёх, и
      #      это не эффект потолка `<1.0` (`§−53`): свежайшая 1.5.9 несёт ТЕ ЖЕ
      #      три плюс четвёртую (PYSEC-2026-311). Апгрейд ухудшил бы, а не
      #      вылечил — и стоил бы мажорного слома API.
      #   2. Ни одна из трёх НЕ ДОСТИЖИМА в этом развёртывании. Все три — про
      #      МНОГОАРЕНДНЫЙ СЕРВЕР: сквозная авторизация между тенантами
      #      (CVE-2026-45830), инъекция кода через HTTP `/api/v2/...` при
      #      `trust_remote_code=true` (CVE-2026-45833) и `SimpleRBAC`,
      #      не проверяющий область права (CVE-2026-45831). Проект поднимает
      #      `chromadb.PersistentClient(path=…)` — встроенный движок на диске,
      #      один процесс. Ни сервера, ни тенантов, ни провайдера авторизации,
      #      ни `trust_remote_code` в репозитории НЕТ (проверено grep'ом по
      #      `src/` и `cloud_function/`).
      #
      # Подавляются ИМЕННО ЭТИ ТРИ ID, а не пакет целиком: любая НОВАЯ уязвимость
      # — в chromadb или где угодно ещё — снова красит job. Постоянно красная
      # «совещательная» проверка учит игнорировать проверки; именно так гейт и
      # умирает (тот же класс, что `§−97` E-9).
      #
      # Снять подавление, когда появится версия с фиксом ИЛИ если проект
      # когда-нибудь поднимет ChromaDB в серверном режиме.
      - name: Audit resolved dependency tree
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831

  secret-scan:
    name: gitleaks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # advisory-first; flip to blocking once tuned
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
