# ────────────────────────────────────────────────────────────────────────────
# Google Cloud Build — RAMP Bot CI/CD pipeline
#
# Triggered automatically on every git push (configure trigger in GCP Console
# or via: gcloud beta builds triggers create github ...)
#
# One-shot manual run:
#   gcloud builds submit --config cloudbuild.yaml --project YOUR_PROJECT_ID .
#
# Substitution variables (override via --substitutions flag or Build Trigger UI):
#   _REGION   — GCP region for Artifact Registry + Cloud Run
#   _REPO     — Artifact Registry repository name
#   _SERVICE  — Cloud Run service name
# ────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION:   us-central1
  _REPO:     ramp
  _SERVICE:  ramp-bot
  # GCS bucket that backs the gcsfuse-mounted state volume (free tier:
  # SQLite is <1 MB, well under the 5 GB Standard-storage free allowance
  # in us-central1).  Create once before first deploy:
  #   gcloud storage buckets create gs://ramp-bot-state \
  #     --location=us-central1 --uniform-bucket-level-access
  _STATE_BUCKET: ramp-bot-state
  # Serverless VPC Access connector for STATIC egress IP (2026-07-08 fix for the
  # Cloudflare-WAF 403 that blocks Cloud Run's shared IP pool from the broker).
  # Empty by default → deploy behaves EXACTLY as before (no VPC routing).  Set
  # it (in the Build Trigger substitutions, or `scripts/setup_static_egress.sh`
  # sets it for you) to route all egress through Cloud NAT + a reserved static
  # IP the broker's Cloudflare no longer challenges.  Format: connector NAME
  # (same region) or full projects/…/connectors/… path.
  _VPC_CONNECTOR: ''
  # ── ГЛАВНЫЙ БОТ: имя секрета и хэндл (§−101, переключено §−102) ───────────
  # 🔴 ЭТИ ДВЕ ПОДСТАНОВКИ ПЕРЕКЛЮЧАЮТСЯ ТОЛЬКО ВМЕСТЕ.
  # Слева от `=` в `--set-secrets` — имя переменной В КОНТЕЙНЕРЕ, справа —
  # имя СЕКРЕТА в Secret Manager. Порознь менять НЕЛЬЗЯ: хэндл едет в отчёт и
  # превращается в deep-link «Применить идею». Поменяли хэндл раньше токена —
  # кнопка ведёт к боту, которого ещё не опрашивают; позже — к боту, которого
  # уже не опрашивают. Отчёт статичен: ошибку в выпущенном HTML не поправить.
  #
  # 🔴 Дефолт обязан называть СУЩЕСТВУЮЩИЙ секрет: привязка к несуществующему
  # роняет ДЕПЛОЙ целиком, и прод остаётся на старой ревизии. Меняете это имя —
  # сначала заведите секрет и выдайте рантайм-аккаунту `secretAccessor`
  # (`docs/roadmap/rename_ombrios/OPERATOR_SWITCH.md`).
  #
  # Прежние значения — путь отката, секрет `RAMP_BOT_TOKEN` в проекте оставлен:
  #   _BOT_TOKEN_SECRET: 'RAMP_BOT_TOKEN'
  #   _BOT_USERNAME:     'KEN_investment_bot'
  _BOT_TOKEN_SECRET: 'OMBRI_BOT_TOKEN'
  _BOT_USERNAME:     'Ombri_bot'
  # Бот-загрузчик котировок (IB-8). ПУСТО ПО УМОЛЧАНИЮ → шаг ниже не делает
  # ничего, и текущий деплой остаётся ровно таким, каким был. Заполните имя
  # сервиса (например `ramp-ingest-bot`), когда будете готовы: понадобятся
  # секрет из _INGEST_BOT_TOKEN_SECRET в Secret Manager, бакет из _QUOTES_BUCKET и
  # ваш Telegram-id в _INGEST_ADMIN_IDS.
  _INGEST_SERVICE: ''
  _INGEST_ADMIN_IDS: ''
  # Имя СЕКРЕТА В SECRET MANAGER с токеном бота-загрузчика. Вынесено в
  # подстановку, потому что проект переезжает с имени RAMP на OMBRI, а имя
  # секрета живёт не в репозитории: переименовали в GCP → поменяли здесь одну
  # строку (или передали `--substitutions=_INGEST_BOT_TOKEN_SECRET=...`), не
  # трогая шаг деплоя.
  # 🔴 Секреты ГЛАВНОГО бота здесь НЕ ЗАТРОНУТЫ: он работает, его переезд —
  # отдельная осознанная операция.
  _INGEST_BOT_TOKEN_SECRET: 'OMBRI_INGEST_BOT_TOKEN'
  # 🔴 СВОЙ сервис-аккаунт загрузчика — не удобство, а условие.
  # Без него Cloud Run берёт дефолтный Compute-SA, у которого уже есть
  # objectAdmin на _STATE_BUCKET, то есть на tokenomics.db (балансы) и
  # users_vault.db (ключи брокера). Тогда любое ограничение прав — хоть
  # отдельным бакетом, хоть условием IAM — становится словами: сервис всё
  # равно бежит с полным доступом. Поэтому шаг ниже ОТКАЗЫВАЕТСЯ деплоить
  # загрузчик, пока эта подстановка пуста.
  # Формат: ramp-ingest@<PROJECT_ID>.iam.gserviceaccount.com
  _INGEST_SA: ''
  # ОТДЕЛЬНЫЙ бакет, а не _STATE_BUCKET: там лежат tokenomics.db (балансы) и
  # users_vault.db (зашифрованные ключи брокера). Ограничивается не человек, а
  # всегда работающий сервис-писатель (PLAN §7.1).
  _QUOTES_BUCKET: 'ramp-bot-quotes'

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # ── Step 2: TEST GATE — run unittest discover INSIDE the just-built image ──
  # Hard prerequisite for push + deploy.  Any failed assertion fails the
  # build and the deploy step (which waits for [push, test]) never runs.
  # Network-isolated: the suite mocks FRED / Anthropic / Tradernet — no
  # live calls leave the builder.
  - id: test
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args:
      - run
      - --rm
      - -e
      - PYTHONPATH=/app/src
      - --entrypoint=python
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -m
      - unittest
      - discover
      - -s
      - /app/tests
      # 🔴 IB-F1 (исправлено 2026-08-18).  Шаблон был `test_phase*.py`, и мимо
      # деплой-гейта проходил ВЕСЬ ценовой путь: `test_stooq_*`, `test_manual_*`,
      # `test_contracts_*`, `test_engine_*`, `test_layering`, `test_repo_hygiene`.
      # Зелёный GitHub CI не означал проверенный ОБРАЗ — CI видит полный
      # чекаут, Cloud Build только то, что попало в слой.
      # Единственной причиной сужения был `import pytest` в двух брокерских
      # тестах; теперь он необязателен, и гейт смотрит на всю сюиту.
      # Тесты, читающие `design/`, `docs/`, `scripts/`, `cloud_function/`,
      # обязаны сами вызывать `skipTest` — в образе этих каталогов нет.
      - -p
      - "test_*.py"

  # ── Step 3: Push both tags (only when tests are green) ─────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [test]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # ── Step 4: Deploy to Cloud Run (only when push + test succeeded) ──────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push, test]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1        # keep bot alive between polls
      - --max-instances=1        # single instance — SQLite is not multi-writer safe
      - --memory=2Gi             # pandas + sklearn need headroom
      - --cpu=1
      - --timeout=3600           # max request timeout (health probe)
      - --concurrency=1
      - --no-cpu-throttling        # CRITICAL: bot uses long-polling, not incoming HTTP
      - --no-allow-unauthenticated
      # PERSISTENT STATE — gcsfuse-mounted Cloud Storage bucket survives
      # every redeploy / scale-to-zero / cold-start.  Free-tier safe.
      # The runtime SA needs roles/storage.objectAdmin on _STATE_BUCKET.
      - --add-volume=name=state,type=cloud-storage,bucket=${_STATE_BUCKET}
      - --add-volume-mount=volume=state,mount-path=/mnt/state
      # Secrets injected from Secret Manager — values never touch image layers
      - --set-secrets=OMBRI_BOT_TOKEN=${_BOT_TOKEN_SECRET}:latest,FINTECH_MASTER_KEY=FINTECH_MASTER_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,FREEDOM_API_KEY=FREEDOM_API_KEY:latest,FREEDOM_API_SECRET=FREEDOM_API_SECRET:latest,FRED_API_KEY=FRED_API_KEY:latest
      # Plain env vars — non-sensitive configuration.
      # TOKENOMICS_DB_PATH points the async SQLite layer at the persistent
      # gcsfuse volume — without this every redeploy wipes user balances.
      # REPORTING_CURRENCY=USD pins H2 base-currency to USD for the beta
      # cohort; FX-conversion auto-no-ops on USD-only portfolios.
      # VAULT_DB_PATH points the SecureVault (Fernet-encrypted broker
      # credentials) at the SAME persistent gcsfuse volume so users do NOT
      # have to re-onboard after every redeploy (B1).
      # ADMIN_USER_IDS — Telegram IDs allowed to /grant test tokens.
      # 148046720 is the owner's account; add more comma-separated as needed.
      #
      # PREMIUM_REPORT_ENABLED=true — ROOT-CAUSE FIX (2026-06-27): the Premium V2
      # React report is gated by this flag (html_renderer reads it at import).
      # `gcloud run deploy --set-env-vars` REPLACES the ENTIRE env-var set on
      # every deploy, so a value set by hand in the console was WIPED back to
      # unset (→ "false") on the next CI deploy — which is why production kept
      # serving the v3 Jinja report even though the flag "was on".  Pinning it
      # here makes the premium routing persistent across every redeploy.  The
      # render path still falls back to v3 on any premium error (see
      # html_renderer.render_report_html), so this is safe to ship.
      #
      # THREAD CAPS (§−94) — ОБЯЗАТЕЛЬНЫ, и по той же причине, что у RAG-функции
      # ниже (шаг 5).  Бот гоняет ТОТ ЖЕ ONNX-эмбеддинг в контейнере:
      # `entrypoint._boot_ingest_from_inbox` на буте ингестит PDF, которых нет в
      # базе.  Для этой нагрузки INFRA_NETWORKING.md §2 предписывает 4Gi/2CPU +
      # ограничение потоков, а бот живёт на 2Gi/1CPU и БЕЗ ограничения: при
      # `--cpu=1` onnxruntime/OpenBLAS всё равно поднимают поток на ядро и
      # переподписывают единственный CPU, отбирая его у event-loop бота ровно
      # тогда, когда пользователь ждёт портфель.  На одном CPU потоки > 1 — это
      # чистые накладные расходы и для pandas/sklearn тоже, так что кап здесь
      # ничего не замедляет.
      - --set-env-vars=BOT_USERNAME=${_BOT_USERNAME},REPORT_BUCKET_NAME=ramp-bot-reports,CHROMA_BUCKET=ramp-bot-chroma-db-investadv,TOKENOMICS_DB_PATH=/mnt/state/tokenomics.db,VAULT_DB_PATH=/mnt/state/users_vault.db,REPORTING_CURRENCY=USD,ADMIN_USER_IDS=148046720,PREMIUM_REPORT_ENABLED=true,STATIC_EGRESS=off,STOOQ_DB_PATH=/mnt/state/stooq/prices.sqlite,STOOQ_LOCAL_COPY_DIR=/tmp/ramp-stooq,OMP_NUM_THREADS=1,OPENBLAS_NUM_THREADS=1,TOKENIZERS_PARALLELISM=false

  # ── Step 4b: STATIC EGRESS (2026-07-08 fix for Cloudflare-WAF 403) ──────────
  # The broker's Cloudflare WAF blocks Cloud Run's SHARED egress IP pool (the
  # client already sends a browser User-Agent + retries — the block is IP-based,
  # not header-based).  Routing egress through a Serverless VPC connector →
  # Cloud Router + Cloud NAT with a RESERVED static IP gives a stable, non-pool
  # address the WAF no longer challenges.  This step is a NO-OP when
  # _VPC_CONNECTOR is empty (default), so it never changes the current deploy;
  # once you run scripts/setup_static_egress.sh (creates the connector + NAT +
  # static IP and sets the substitution), every deploy pins egress here.
  - id: configure-egress
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy]
    entrypoint: bash
    args:
      - -c
      - |
        # 🔴 R-9.  Пустой `_VPC_CONNECTOR` — это ШТАТНЫЙ дефолт, поэтому шаг
        # годами заканчивался предупреждением в логе сборки, которого никто не
        # читает, и сервис молча жил на общем пуле IP.  Состояние теперь
        # доезжает до контейнера переменной `STATIC_EGRESS`: диагностика отказа
        # брокера обязана называть ПРИЧИНУ, по которой блок не пройдёт сам
        # (§−94), а не оставлять её в истории сборки.
        #
        # Дефолт `off` ставит шаг `deploy`, а этот шаг только ПОВЫШАЕТ его до
        # `on`.  Иначе обычный деплой (без коннектора) создавал бы ВТОРУЮ
        # ревизию Cloud Run ради одной переменной — цена диагностики не должна
        # быть выше самой диагностики.
        if [ -n "${_VPC_CONNECTOR}" ]; then
          echo "Routing ramp-bot egress through VPC connector: ${_VPC_CONNECTOR}"
          gcloud run services update ${_SERVICE} \
            --region=${_REGION} \
            --vpc-connector=${_VPC_CONNECTOR} \
            --vpc-egress=all-traffic \
            --update-env-vars=STATIC_EGRESS=on \
            --quiet \
            || echo "WARN: could not attach VPC connector — check it exists in ${_REGION} and the SA has run.admin. Bot still runs on the shared egress IP."
        else
          echo "No _VPC_CONNECTOR set — bot uses the default shared egress IP (Cloudflare-WAF risk). Run scripts/setup_static_egress.sh to enable a static egress IP."
          echo "STATIC_EGRESS=off задан шагом deploy — сервис знает, что живёт на общем пуле."
        fi
        exit 0

  # ── Step 4c: INGEST BOT (IB-8) — ВЫКЛЮЧЕН, пока _INGEST_SERVICE пуст ───────
  # Второй Cloud Run сервис из ТОГО ЖЕ образа: логика разбора не дублируется,
  # `finance/stooq_ingest.py` уже внутри. Переопределяется только команда.
  #
  # Шаг fail-soft и no-op по умолчанию — тот же приём, что у configure-egress и
  # deploy-rag-function: пустая подстановка не должна ломать сборку главного
  # бота, ради которой этот файл существует.
  #
  # 🔴 Главный бот здесь НЕ ТРОГАЕТСЯ. Переезд его STOOQ_DB_PATH на новый бакет
  # делается ОТДЕЛЬНО и осознанно: `--set-env-vars` заменяет ВЕСЬ набор
  # переменных, и эта грабля уже однажды выключила Premium V2 в проде.
  - id: deploy-ingest-bot
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy]
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_INGEST_SERVICE}" ]; then
          echo "Ingest-бот не деплоится: _INGEST_SERVICE пуст (штатное состояние)."
          exit 0
        fi
        if [ -z "${_INGEST_ADMIN_IDS}" ]; then
          echo "WARN: _INGEST_ADMIN_IDS пуст — бот откажется стартовать (fail-closed)."
          echo "      Это защита, а не сбой: сервис пишет в базу котировок."
        fi
        if [ -z "${_INGEST_SA}" ]; then
          echo "🔴 ОТКАЗ: _INGEST_SA пуст."
          echo "   Без своего сервис-аккаунта загрузчик побежит под дефолтным"
          echo "   Compute-SA, а у того полный доступ к бакету с балансами и"
          echo "   ключами брокера. Ограничение прав тогда существует только на"
          echo "   бумаге. Заведите SA и выдайте ему доступ УЗКО:"
          echo "     gcloud iam service-accounts create ramp-ingest"
          echo "     gcloud storage buckets add-iam-policy-binding gs://<бакет> \\"
          echo "       --member=serviceAccount:<SA> --role=roles/storage.objectAdmin \\"
          echo "       --condition=title=stooq-only,expression=\"resource.name.startsWith('projects/_/buckets/<бакет>/objects/stooq/')\""
          echo "   Главный бот не затронут."
          exit 0
        fi
        gcloud run deploy ${_INGEST_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --command=python --args=/app/src/ingest_entrypoint.py \
          --service-account=${_INGEST_SA} \
          --min-instances=1 \
          --max-instances=1 \
          --concurrency=1 \
          --memory=512Mi \
          --cpu=1 \
          --timeout=3600 \
          --no-cpu-throttling \
          --no-allow-unauthenticated \
          --set-secrets=OMBRI_INGEST_BOT_TOKEN=${_INGEST_BOT_TOKEN_SECRET}:latest,INGEST_TASK_TOKEN=INGEST_TASK_TOKEN:latest \
          --set-env-vars=QUOTES_BACKEND=gcs,QUOTES_BUCKET=${_QUOTES_BUCKET},QUOTES_PREFIX=stooq/,INGEST_ADMIN_IDS=${_INGEST_ADMIN_IDS} \
          --quiet \
          || echo "WARN: деплой ingest-бота не прошёл. Главный бот не затронут."
        exit 0

  # ── Step 5: Deploy the RAG-ingest Cloud Function (M3) ──────────────────────
  # Listens to the DEDICATED, write-controlled ingest bucket (NOT the reports
  # bucket — M2 fix) and re-indexes uploaded bank PDFs into ChromaDB.
  # Entry point is `on_pdf_uploaded` (the actual handler in
  # cloud_function/main.py); FINTECH_MASTER_KEY is intentionally NOT passed
  # (the function never touches the user vault — L6).
  #
  # FAIL-SOFT: this step does NOT block the main bot deploy.  Cloud Build SA
  # needs `roles/cloudfunctions.developer` (or `.admin`) on the project to
  # deploy/update functions; until that's granted, the step logs a warning
  # and exits 0 so the bot itself ships.  Grant once with:
  #   PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
  #   gcloud projects add-iam-policy-binding $PROJECT_ID \
  #     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
  #     --role="roles/cloudfunctions.developer"
  #   gcloud projects add-iam-policy-binding $PROJECT_ID \
  #     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
  #     --role="roles/iam.serviceAccountUser"
  - id: deploy-rag-function
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy]
    entrypoint: bash
    args:
      - -c
      - |
        # MEMORY/CPU (2026-07-08 fix): the default 1Gi/1CPU caused a
        # Segmentation Fault (signal 11) exactly when chromadb's
        # DefaultEmbeddingFunction downloads + loads the all-MiniLM-L6-v2 ONNX
        # model (79 MB) and runs onnxruntime over the PDF — classic OOM on a
        # constrained container.  4Gi + 2 CPU gives the embedder headroom; the
        # thread-cap env (OMP/OpenBLAS/tokenizers) prevents onnxruntime from
        # over-subscribing CPU and segfaulting under memory pressure.  Timeout
        # bumped 300→540s because the first cold invocation also downloads the
        # model before it can embed.
        gcloud functions deploy ramp-bot-rag-ingest \
          --gen2 \
          --runtime python312 \
          --region ${_REGION} \
          --source ./cloud_function \
          --entry-point on_pdf_uploaded \
          --trigger-event-filters="type=google.cloud.storage.object.v1.finalized" \
          --trigger-event-filters="bucket=ramp-bot-chroma-db-inbox-investadv" \
          --set-env-vars CHROMA_BUCKET=ramp-bot-chroma-db-investadv,OMP_NUM_THREADS=1,OPENBLAS_NUM_THREADS=1,TOKENIZERS_PARALLELISM=false \
          --memory 4Gi \
          --cpu 2 \
          --timeout 540s \
          --max-instances 1 \
          --concurrency 1 \
          --quiet \
          || echo "WARN: Cloud Function deploy skipped (likely 403). Grant the Cloud Build SA roles/cloudfunctions.developer + roles/iam.serviceAccountUser to enable. Main bot deploy is unaffected."
        exit 0

# Images promoted to Artifact Registry after a successful build
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM   # faster builds for dependency compilation

timeout: 1200s  # 20 min build timeout — pip install sklearn is slow
